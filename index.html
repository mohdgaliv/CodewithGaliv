<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#4A90D9">
    <meta name="description" content="Student App - Your Complete Academic Companion">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Student App">
    
    <title>Student App - Academic Companion</title>
    
    <!-- Favicon (inline SVG - no file needed) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233B82F6'/><text x='32' y='44' text-anchor='middle' font-size='32'>🎓</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%233B82F6'/><text x='96' y='128' text-anchor='middle' font-size='96'>🎓</text></svg>">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <style>
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; color: white; font-family: system-ui, sans-serif;
        }
        .spinner {
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #main-content { min-height: 100vh; background: var(--bg-primary); }
        
        .error-screen {
            display: none; position: fixed; inset: 0; z-index: 10000;
            background: #fff; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center; font-family: system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loading-screen">
            <div style="font-size:50px;">🎓</div>
            <div class="spinner"></div>
            <p style="font-weight:500;">Loading Student App...</p>
            <p style="font-size:13px;opacity:0.8;" id="loading-status">Initializing...</p>
        </div>
        
        <div id="error-screen" class="error-screen">
            <div style="font-size:64px;">⚠️</div>
            <h2 style="color:#EF4444;margin-bottom:8px;">App Load Error</h2>
            <p style="color:#6B7280;margin-bottom:4px;" id="error-message"></p>
            <p style="color:#9CA3AF;font-size:13px;margin-bottom:16px;" id="error-detail"></p>
            <button onclick="location.reload()" style="padding:12px 24px;background:#3B82F6;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">🔄 Reload App</button>
        </div>
        
        <main id="main-content" role="main"></main>
        <div id="toast-container" class="toast-container" aria-live="polite"></div>
        <div id="modal-container" class="modal-container" aria-hidden="true"></div>
    </div>

    <script type="module">
        // Detect base path for GitHub Pages
        var BASE = '/';
        if (window.location.hostname.includes('github.io')) {
            var parts = window.location.pathname.split('/');
            if (parts[1]) BASE = '/' + parts[1] + '/';
        }
        console.log('🔗 Base Path:', BASE);
        
        function updateStatus(msg) {
            var el = document.getElementById('loading-status');
            if (el) el.textContent = msg;
        }
        
        function showError(msg, detail) {
            document.getElementById('loading-screen').style.display = 'none';
            var errScreen = document.getElementById('error-screen');
            errScreen.style.display = 'flex';
            document.getElementById('error-message').textContent = msg;
            document.getElementById('error-detail').textContent = detail;
        }
        
        async function loadModule(path, name) {
            try {
                updateStatus('Loading ' + name + '...');
                var fullPath = BASE + path;
                console.log('📦 Loading: ' + fullPath);
                var mod = await import(fullPath);
                console.log('✅ ' + name + ' loaded');
                return mod;
            } catch(e) {
                console.error('❌ ' + name + ' failed:', e);
                throw new Error(name + ' failed: ' + e.message);
            }
        }
        
        async function init() {
            try {
                await loadModule('js/utils.js', 'Utils');
                await loadModule('js/event-bus.js', 'EventBus');
                await loadModule('js/storage.js', 'Storage');
                await loadModule('js/state-manager.js', 'StateManager');
                
                updateStatus('Applying theme...');
                var themeMod = await loadModule('js/theme-manager.js', 'ThemeManager');
                if (themeMod.default && themeMod.default.init) {
                    themeMod.default.init();
                }
                
                await loadModule('js/validator.js', 'Validator');
                await loadModule('js/formatter.js', 'Formatter');
                await loadModule('js/notifications.js', 'Notifications');
                await loadModule('js/api.js', 'API');
                await loadModule('js/auth.js', 'Auth');
                await loadModule('js/pwa.js', 'PWA');
                await loadModule('js/router.js', 'Router');
                
                updateStatus('Starting app...');
                await loadModule('js/app.js', 'App');
                
                setTimeout(function() {
                    var loader = document.getElementById('loading-screen');
                    if (loader) {
                        loader.style.opacity = '0';
                        loader.style.transition = 'opacity 0.3s';
                        setTimeout(function() { loader.remove(); }, 300);
                    }
                }, 500);
                
                console.log('🎉 App initialized!');
            } catch(e) {
                console.error('💥 Init failed:', e);
                showError('Failed to load application modules.', e.message);
            }
        }
        
        init();
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            var swPath = '/Student-app/service-worker.js';
            if (!window.location.hostname.includes('github.io')) swPath = '/service-worker.js';
            window.addEventListener('load', function() {
                navigator.serviceWorker.register(swPath, { scope: '/' })
                    .then(function(r) { console.log('SW registered'); })
                    .catch(function(e) { console.log('SW skipped'); });
            });
        }
    </script>
</body>
</html>
